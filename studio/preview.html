<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Preview</title>

<!-- The real thing. This frame loads exactly the stylesheets a
     published case study loads and nothing else, so what the studio
     shows is not an impression of the page — it is the page. If a
     block looks wrong here it is wrong on the site. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/site.css">
<link rel="stylesheet" href="/shared/blocks.css">

<!-- 3D and Lottie, so a glb or a .json block is real here too. -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

<style>
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-muted);
    font-family: var(--font-sans);
    padding-block: var(--space-xl, 60px);
  }
  /* The empty state, before any block exists. */
  .pv-empty {
    max-width: 420px;
    margin: 18vh auto;
    padding-inline: 24px;
    text-align: center;
    font-family: var(--font-serif);
    font-size: 22px;
    line-height: 1.3;
    color: var(--color-muted-50);
  }
</style>
</head>
<body>

<div id="pv-root">
  <p class="pv-empty">Nothing yet. Add a block on the left and it appears here.</p>
</div>

<!-- The site's own cursor. site.css hides the OS one everywhere, so
     without this the frame would have no pointer at all — and more to
     the point, tooltips like "Interactive 3D — drag to rotate" ride on
     the custom cursor, so this is the only way to see whether a block's
     hover actually reads. -->
<script defer src="/shared/cursor.js"></script>
<script src="/shared/blocks.js"></script>
<script>
/* The frame owns no state. The studio posts the whole block array on
   every change and this redraws it — one direction, so the preview
   can never drift from what will be exported. */
(function () {
  'use strict';
  var root = document.getElementById('pv-root');

  window.addEventListener('message', function (e) {
    // Same-origin only: the studio and this frame are served together.
    if (e.origin !== location.origin) return;
    var msg = e.data;
    if (!msg || msg.kind !== 'studio:render') return;

    var blocks = msg.blocks || [];
    if (!blocks.length) {
      root.innerHTML = '<p class="pv-empty">Nothing yet. Add a block on the left and it appears here.</p>';
      return;
    }
    root.innerHTML = window.Blocks.render(blocks, msg.ctx || {});
    window.Blocks.enhance(root);
  });

  /* A file dragged over the preview is meant for the project, but the
     frame is a separate document and the drop would land here and do
     nothing — or worse, the browser would navigate this frame to the
     file. Hand both events up to the studio instead. */
  ['dragover', 'drop'].forEach(function (type) {
    window.addEventListener(type, function (e) {
      e.preventDefault();
      if (type === 'drop') parent.postMessage({ kind: 'studio:dropped-on-preview' }, location.origin);
    });
  });

  // Tell the studio the frame is ready to be drawn into.
  parent.postMessage({ kind: 'studio:ready' }, location.origin);
})();
</script>
</body>
</html>
