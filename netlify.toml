# DORMANT — the site is hosted on Cloudflare Pages (see wrangler.toml and
# README "Hosting and deploy"). The Netlify account is out of quota and no
# traffic reaches it. Kept only so a stray Netlify build stays harmless.
#
# Static site (no build step) plus serverless functions for moji's
# global leaderboard. Publishing the repo root as-is.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
