<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <!-- Hidden page: keep it out of search engines and crawlers -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F8F6F3">
  <title>moji</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <div id="particles"></div>

    <!-- ── START ─────────────────────────────────────── -->
    <section class="screen" id="screen-start">
      <button class="btn-start" id="start-btn"><span>Start</span></button>
      <div class="start-hint" id="start-hint">👉</div>
    </section>

    <!-- ── GAME ──────────────────────────────────────── -->
    <section class="screen" id="screen-game">
      <div class="topbar">
        <span class="timer"><span id="timer-val">00:00</span></span>
      </div>
      <div class="game-body">
        <div class="puzzle-clue" id="puzzle-clue"></div>
        <div class="answer" id="answer"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </section>

    <!-- ── END ───────────────────────────────────────── -->
    <section class="screen" id="screen-end">
      <div class="end-emoji" id="end-emoji">🤑</div>
      <div class="end-time" id="end-time">00:00</div>
      <div class="name-row" id="name-row">
        <input class="name-input" id="name-input" maxlength="14" placeholder="Your name" />
        <button class="btn-solid" id="save-btn">Save</button>
      </div>
      <p class="note" id="end-note">Add your name to the leaderboard</p>
    </section>

    <!-- ── LEADERBOARD ───────────────────────────────── -->
    <section class="screen" id="screen-board">
      <div class="board-head">
        <h2>Leaderboard</h2>
      </div>
      <ul class="board-list" id="board-list"></ul>
      <p class="note" id="board-note">Come back tomorrow for a new clue</p>
    </section>
  </div>

  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
