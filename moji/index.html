<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <!-- Hidden page: keep it out of search engines and crawlers -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F8F6F3">
  <title>moji</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <div id="particles"></div>

    <!-- ── START ─────────────────────────────────────── -->
    <section class="screen" id="screen-start">
      <div class="emoji-strip">🐝 🍂 ⭐ 🔥 🦊</div>
      <h1 class="brand">moji</h1>
      <p class="tagline">Cryptic puzzles, mostly in emoji. Read the picture out loud — then race the clock.</p>
      <button class="btn-start" id="start-btn">START</button>
      <div class="link-row">
        <button id="board-btn-start">🏆 Leaderboard</button>
      </div>
    </section>

    <!-- ── GAME ──────────────────────────────────────── -->
    <section class="screen" id="screen-game">
      <div class="topbar">
        <span class="timer"><span class="dot"></span><span id="timer-val">00:00.0</span></span>
        <span class="progress" id="progress">1 / 6</span>
      </div>
      <div class="game-body">
        <div class="puzzle-emojis" id="puzzle-emojis"></div>
        <div class="puzzle-hint" id="puzzle-hint"></div>
        <div class="answer" id="answer"></div>
        <div class="feedback" id="feedback"></div>
        <div class="game-actions">
          <button class="btn" id="next-btn" style="display:none">Next →</button>
        </div>
      </div>
    </section>

    <!-- ── END ───────────────────────────────────────── -->
    <section class="screen" id="screen-end">
      <h2 class="end-title">Solved! 🎉</h2>
      <p class="end-sub">You cracked every clue in</p>
      <div class="end-time" id="end-time">00:00.0</div>
      <div class="name-row">
        <input class="name-input" id="name-input" maxlength="14" placeholder="Your name" />
        <button class="btn" id="save-btn">Save</button>
      </div>
      <p class="note">Scores are saved on this device.</p>
    </section>

    <!-- ── LEADERBOARD ───────────────────────────────── -->
    <section class="screen" id="screen-board">
      <div class="board-head">
        <h2>🏆 Leaderboard</h2>
      </div>
      <ul class="board-list" id="board-list"></ul>
      <div class="game-actions" style="justify-content:center">
        <button class="btn" id="again-btn">Play again</button>
        <button class="btn ghost" id="board-back-btn">Home</button>
      </div>
      <p class="note">Fastest total time wins. Stored locally on this device for now.</p>
    </section>
  </div>

  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
