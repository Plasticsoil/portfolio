<!doctype html>
<!--
  FunType embeddable viewer — designed to be loaded inside an <iframe>
  on any other site. The host page passes the effect, the word and the
  palette through the URL, and we mount the live effect (with hover +
  click interactivity) fitted to whatever iframe size is set.

  Example:
    <iframe src="https://yamliv.net/fun/embed.html?effect=pack
                 &word=hello
                 &pal=FFFFFF,C8F06E,3FB4F0,5BE03A"
            width="600" height="600" frameborder="0"></iframe>
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunType embed</title>
    <meta name="copyright" content="FunType © 2026 yamliv.net. Outputs CC BY-NC 4.0. https://yamliv.net/fun/license" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@900,700,500,400,300&display=swap"
    />
    <!-- Hebrew fallback. Switzer has no Hebrew glyphs; Rubik covers
         Hebrew so the embed renders both languages cleanly. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      /* Centred 1080×1080 stage, scaled (via transform) to fit whatever
         viewport size the host iframe gives us. transform-origin sits
         at the centre so the scale shrinks toward the visual middle. */
      #embed-wrap {
        position: absolute; inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .ft-credit {
        position: fixed; right: 10px; bottom: 8px; z-index: 50;
        font-family: "Switzer", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 500; font-size: 11px; letter-spacing: .01em; line-height: 1;
        color: #4E4B5D; opacity: .62; text-decoration: none;
        transition: opacity .2s ease;
      }
      .ft-credit:hover { opacity: 1; }
      #embed-stage {
        width: 1080px;
        height: 1080px;
        flex: none;
        position: relative;
        transform-origin: center center;
        will-change: transform;
      }
    </style>
    <script type="module" crossorigin src="/fun/assets/embed-cb89c361.js"></script>
    <link rel="modulepreload" crossorigin href="/fun/assets/render-CCgHOVR5.js">
    <link rel="modulepreload" crossorigin href="/fun/assets/cornerPinMesh-DvsMy1Jx.js">
    <link rel="modulepreload" crossorigin href="/fun/assets/palette-D5fFc6np.js">
    <link rel="modulepreload" crossorigin href="/fun/assets/loop-ObPNdiM7.js">
  </head>
  <body>
    <div id="embed-wrap">
      <div id="embed-stage"></div>
    </div>
    <a class="ft-credit" href="https://yamliv.net/fun" target="_blank" rel="noopener">FunType by yamliv.net</a>
  </body>
</html>
