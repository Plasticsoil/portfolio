<!doctype html>
<!--
  FunType thumbnail — bare Corner-effect mount used as the portfolio
  card preview. Auto-cycles "COMING" → "SOON". No chrome, no controls,
  no fonts loaded beyond Switzer (the only thing the effect uses).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunType — thumb</title>
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@900,700,500,400&display=swap"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #FF7300;
        overflow: hidden;
      }
      /* OUTER wrap carries the fit transform. We can't put the transform on
         the stage itself because mountCornerPin overwrites stage.style.cssText
         on every mount, wiping our transform. The wrap stays untouched. */
      #thumb-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1080px;
        transform-origin: 0 0;
        will-change: transform;
      }
      #thumb-stage {
        position: relative;
        width: 1080px;
        height: 1080px;
      }
    </style>
    <script type="module" crossorigin src="/fun/assets/thumb-DP9ClpeY.js"></script>
    <link rel="modulepreload" crossorigin href="/fun/assets/easing-DE46m1uD.js">
    <link rel="modulepreload" crossorigin href="/fun/assets/cornerPinMesh-ZU0_oQaA.js">
</head>
  <body>
    <div id="thumb-wrap"><div id="thumb-stage"></div></div>
  </body>
</html>
