<!doctype html>
<!--
  Fun Type Zone — interactive kinetic typography.
  Design & creative direction in collaboration with PlasticSoil — https://plasticsoil.com
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunType</title>
    <link rel="icon" type="image/svg+xml" href="/fun/favicon.svg" />
    <!-- Switzer = the kinetic art letters; Instrument Serif + Inter =
         portfolio-matched UI (Inter is the yamliv tooltip face — used by
         the cursor tooltip to match the home site to the pixel). -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@900,700,500,400,300&display=swap"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400&display=swap"
    />
    <script type="module" crossorigin src="/fun/assets/main-dyL5LMuh.js"></script>
    <link rel="modulepreload" crossorigin href="/fun/assets/easing-DE46m1uD.js">
    <link rel="modulepreload" crossorigin href="/fun/assets/cornerPinMesh-DKd1bGLB.js">
    <link rel="modulepreload" crossorigin href="/fun/assets/palette-KZeIhCnj.js">
    <link rel="stylesheet" crossorigin href="/fun/assets/main-JMfPtCrc.css">
  </head>
  <body>
    <!-- Back to the portfolio: fixed top-left breadcrumb. Matches the
         restrained "/ label" pattern used throughout yamliv.net. -->
    <a class="ft-back" href="/" aria-label="Back to yamliv.net">
      <span class="ft-back-slash">/</span>
      <span class="ft-back-label">portfolio</span>
    </a>

    <header class="masthead" id="top">
      <div class="mast-left">
        <h1 class="mast-logo">Fun</h1>
        <p class="mast-desc">
          A playful lab for kinetic, interactive typography. Type a word, mix
          it, pin it.
        </p>
      </div>
      <nav class="mast-nav" id="mastNav"></nav>
    </header>

    <main id="studio"></main>
    <footer class="site-footer">
      <a class="backtotop" href="#top">Back to top</a>
    </footer>
  </body>
</html>
