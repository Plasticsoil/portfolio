<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunType</title>
    <link rel="icon" type="image/svg+xml" href="/fun/favicon.svg" />
    <!-- Credit: PlasticSoil -->
    <!-- Switzer is only the kinetic art type (the preview); the UI uses the
         portfolio's language: Instrument Serif + Nimbus Sans, muted greys. -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@900,700,500,400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400&display=swap" />
    <!-- Hebrew fallback for the kinetic letters (Switzer has no Hebrew).
         Google's CSS2 endpoint auto-includes the Hebrew subset. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" />
    <style>
      :root {
        --bg:#f8f6f3; --ink:#a3a09b; --emph:#68645e;
        --line:rgba(163,160,155,0.42); --fill:rgba(163,160,155,0.12); --card:#ffffff;
        --serif:"Instrument Serif", Georgia, serif;
        --sans:"Nimbus Sans","Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin:0; }
      body {
        background: var(--bg); color: var(--ink);
        font-family: var(--sans); font-weight: 400;
        height: 100vh; overflow: hidden;
        padding: 20px clamp(16px,4vw,48px);
        display: flex; flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      /* Fall back to a normal scrollable page only when the viewport is too
         small to fit the one-screen layout (laptops + phones). */
      @media (max-width: 880px), (max-height: 720px) {
        body { height: auto; overflow: auto; padding-bottom: 48px; }
      }
      .lead { max-width:1060px; margin:0 auto; width:100%; }

      .topbar { display:flex; align-items:center; justify-content:flex-end; margin-bottom: 8px; }

      /* Fixed top-left breadcrumb — portfolio → FunType.
         Each step is its own link; a muted slash sits between them. */
      .ft-back {
        position: fixed;
        top: clamp(20px, 4vw, 36px);
        left: clamp(20px, 4vw, 36px);
        z-index: 1000;
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        font-family: var(--sans);
        font-size: 14px;
        letter-spacing: 0.01em;
      }
      .ft-back-link {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        color: var(--ink);
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .ft-back-slash,
      .ft-back-sep { color: rgba(163, 160, 155, 0.48); }
      .ft-back-link:hover { color: var(--emph); }
      .ft-back-link:hover .ft-back-slash { color: var(--ink); }
      .back {
        display:inline-flex; align-items:center; gap:8px; text-decoration:none;
        color:var(--ink); font-size:14px;
        padding:8px 14px 8px 11px; border:1px solid var(--line); border-radius:999px; background:var(--card);
        transition: border-color .15s, color .15s, transform .12s;
      }
      .back:hover { border-color:var(--emph); color:var(--emph); }
      .back:active { transform: scale(.96); }
      .brand { font-family:var(--serif); font-size:22px; color:var(--ink); }
      .brand b { color:var(--emph); font-style:italic; font-weight:400; }

      h1 { font-family:var(--serif); font-weight:400; font-size:36px; line-height:1; margin:0 0 14px; color:var(--emph); }

      .grid { max-width:1060px; margin:0 auto; width:100%; flex:1; display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:40px; align-items:start; min-height:0; }
      @media (max-width:880px){ .grid{ grid-template-columns:1fr; gap:24px; } }

      /* preview — frameless: just the visual, centred. Inside a flex parent
         with min-height:0 so the canvas can shrink to fit short viewports. */
      .stage { display:flex; flex-direction:column; align-items:center; gap:12px; height:100%; min-height:0; }
      .frame { display:flex; align-items:center; justify-content:center; width:100%; flex:1; min-height:0; }
      canvas#preview { border-radius:14px; box-shadow:0 26px 60px -30px rgba(80,70,55,.4); display:block; max-width:100%; max-height:100%; height:auto; width:auto; }
      .meta { font-size:13px; color:var(--ink); }

      /* Control sections — desktop keeps the labelled "Text / Colour /
         Output" structure (label-style small caps, not all-caps content).
         Mobile collapses these via the @media block far below. */
      .panel { display:flex; flex-direction:column; gap:18px; }
      .sect { display:flex; flex-direction:column; gap:10px; }
      .sect > .head { display:flex; align-items:center; justify-content:space-between; }
      .sect h2 {
        margin:0;
        font-family:var(--sans);
        font-size:13px;
        font-weight:500;
        letter-spacing:0;
        text-transform:none;          /* no force-uppercase on chrome labels */
        color:var(--emph);
        line-height:1;
      }
      label.fld { font-size:12px; color:var(--ink); letter-spacing:0.02em; }

      input[type=text], select {
        font:inherit; font-size:15px; padding:10px 13px; border:1px solid var(--line);
        border-radius:12px; background:var(--card); color:var(--emph);
      }
      input[type=text]:focus, select:focus { outline:none; border-color:var(--emph); }
      #word { width:100%; }

      /* Info icon — a small "i" pill that holds the meta + hint text
         in a tap-tooltip so they don't burn vertical space on mobile.
         Hidden on desktop (the .meta + .hint paragraphs read fine). */
      .info-ic { display: none; }
      .info-ic[data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        /* Anchor to the RIGHT edge of the icon so the tooltip grows
           leftward — the icon sits next to the Download button at the
           panel's right edge, so a centred bubble would spill off the
           viewport (and through the panel frame). */
        top: 130%; right: 0;
        white-space: pre-line;
        background: var(--card);
        color: var(--emph);
        border: 1px solid var(--line);
        font-family: var(--sans); font-style: normal; font-size: 12px; line-height: 1.45;
        padding: 8px 12px; border-radius: 10px;
        width: max-content; max-width: 240px;
        box-shadow: 0 10px 24px -12px rgba(38,37,30,0.20);
        opacity: 0; pointer-events: none;
        transition: opacity 0.15s ease;
        z-index: 100;
      }
      .info-ic.show::after,
      .info-ic:hover::after { opacity: 1; }

      /* Mobile close X — JUST the icon, no white circle. Sits in the
         top-right corner of the page. */
      .ft-close {
        display: none;
        position: fixed;
        top: clamp(16px, 4vw, 24px);
        right: clamp(16px, 4vw, 24px);
        z-index: 1000;
        width: 32px; height: 32px;
        align-items: center; justify-content: center;
        border: none;
        background: transparent;
        color: var(--emph);
        cursor: pointer;
        padding: 0;
        transition: color 0.15s ease, transform 0.18s ease;
      }
      .ft-close:hover { color: var(--ink); }
      .ft-close:active { transform: scale(0.9); }

      /* Download row — button + tiny "i" icon side by side. The icon
         is intentionally small so it doesn't claim layout — it's just
         a tap-target for the meta + format hint. */
      .download-row { display: flex; align-items: center; gap: 10px; }
      .download-row .download { flex: 1; }

      /* Replace the OS-native select chevron with a custom one tucked away
         from the right edge — the native arrow was butting against the
         frame border. appearance:none strips the default; the background
         SVG renders our chevron with proper padding. */
      select {
        appearance: none;
        -webkit-appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='%2368645e' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
        background-repeat: no-repeat;
        background-position: right 14px center;
        padding-right: 36px;
      }

      /* Swatches — desktop = one connected unit, four rows stacked
         vertically (chip · role · HEX). Mobile collapses these into a
         compact horizontal row of just the chips. */
      .swatches { display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
      .swatch { display:flex; align-items:center; gap:12px; padding:9px 11px; border-bottom:1px solid var(--line); }
      .swatch:last-child { border-bottom:0; }
      .swatch .chip2 { position:relative; width:28px; height:28px; border-radius:8px; flex:none;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.07); overflow:hidden; cursor:pointer; }
      .swatch .chip2 input { position:absolute; inset:-6px; width:150%; height:150%; border:0; padding:0; opacity:0; cursor:pointer; }
      .swatch .role { flex:1; font-size:14px; color:var(--emph); }
      .swatch .hex { font-size:12.5px; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.02em; }

      /* subtle pill buttons (palette / seed shuffle) */
      .iconbtn { display:inline-flex; align-items:center; justify-content:center; gap:8px;
        font:inherit; font-size:13.5px; cursor:pointer;
        background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:7px 13px;
        transition: border-color .15s, color .15s, transform .12s; }
      .iconbtn:hover { border-color:var(--emph); color:var(--emph); }
      .iconbtn:active { transform: scale(.95); }
      .iconbtn.round { width:34px; height:34px; padding:0; }
      .iconbtn svg { width:16px; height:16px; }

      /* segmented control — one connected pill split into thirds with
         shared dividers instead of three separate buttons. Icon + label
         sit inline so each segment stays compact. */
      .seg {
        display:flex;
        gap:0;
        border:1px solid var(--line);
        border-radius:11px;
        overflow:hidden;
        background:var(--card);
      }
      .seg button {
        flex:1; font:inherit; font-size:13px; cursor:pointer;
        padding:10px 8px;
        border:none;
        border-right:1px solid var(--line);
        background:transparent;
        color:var(--ink);
        display:flex; flex-direction:row; align-items:center; justify-content:center;
        gap:8px;
        transition: background .15s, color .15s;
      }
      .seg button:last-child { border-right:none; }
      .seg button .ic { width:20px; height:15px; display:flex; align-items:center; justify-content:center; }
      .seg button .ic i { display:block; border:1.4px solid currentColor; background:transparent; border-radius:2px; }
      .seg button:hover { color:var(--emph); }
      .seg button[aria-pressed=true] { background:var(--fill); color:var(--emph); }

      .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .two .fld { display:block; margin-bottom:6px; }
      .two select { width:100%; }

      .download { width:100%; font:inherit; font-size:16px; cursor:pointer;
        padding:14px; border:1.5px solid var(--emph); border-radius:14px; color:var(--emph); background:transparent;
        transition: background .15s, color .15s, transform .12s; }
      .download:hover { background:var(--emph); color:var(--bg); }
      .download:active { transform: scale(.985); }
      .download:disabled { opacity:.45; cursor:default; }

      #status { font-size:13px; color:var(--ink); min-height:18px; }
      .hint { font-size:12px; color:rgba(163,160,155,.7); line-height:1.5; margin:0; }

      /* Centred light toast for transient confirmations (currently the
         embed copy success). Sits above everything else; auto-fades
         after a short hold. Tiny green dot mirrors the studio's toast. */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%) translateY(20px);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        color: var(--emph);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.1;
        padding: 12px 22px;
        border: 1px solid var(--line);
        border-radius: 999px;
        box-shadow: 0 14px 36px -14px rgba(38, 37, 30, 0.32);
        opacity: 0;
        pointer-events: none;
        z-index: 9000;
        transition: opacity 0.22s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .toast::before {
        content: "";
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #5BE03A;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }


      /* ═══════════════════════════════════════════════════════════════
         MOBILE export overrides (≤880px)
         ═══════════════════════════════════════════════════════════════
         • Hide breadcrumb, show the X close at top-right
         • "Export" title centred + a touch larger, with an inline "i"
           icon that holds the meta (fps · loop · dims) + format hint
         • Hide ALL section h2s + Format / Resolution field labels —
           the controls speak for themselves
         • Colour swatches: ONE rounded frame divided into 4 segments
           (no gap between chips, no HEX, no role text). Shuffle button
           sits to the RIGHT of the swatch group
         • Hide the .meta text below the preview + the .hint paragraph
           below the Download button — both surface in the "i" tooltip */
      @media (max-width: 880px) {
        .ft-back { display: none; }
        .ft-close { display: inline-flex; }

        body { padding-top: 64px; padding-bottom: 24px; }

        /* Hide the "Export" title — the panel itself, the X close in
           the top corner and the URL all say "export". The big title
           was just claiming vertical space on a phone. */
        .title-row { display: none; }

        /* Preview — fills available height so portrait gets tall +
           narrow, landscape gets short + wide (and the controls below
           shift up). max-height keys off viewport height so the panel
           always has room. */
        .stage { gap: 14px; }
        .frame { max-height: 56vh; }
        canvas#preview { max-height: 56vh; max-width: 100%; }

        /* Tiny "i" icon next to Download — small enough not to take
           meaningful layout space. */
        .info-ic {
          display: inline-flex;
          position: relative;
          width: 18px; height: 18px;
          align-items: center; justify-content: center;
          border: 1px solid var(--line);
          border-radius: 50%;
          background: transparent;
          color: var(--ink);
          font-family: var(--serif); font-style: italic; font-size: 11px; line-height: 1;
          cursor: help;
          opacity: 0.7;
        }
        .info-ic::before { content: "i"; }
        .info-ic:hover { opacity: 1; }

        .panel { gap: 22px; }
        .sect { gap: 12px; }

        /* Hide section headers — Text / Colour / Output. The controls
           themselves are enough on a phone. */
        .sect h2 { display: none; }
        /* Hide Format / Resolution + Orientation field labels — the
           select options are obvious. Specificity has to beat the
           desktop rule `.two .fld { display: block }` further up. */
        .fld, .two .fld { display: none; }

        /* Colour section layout (head row collapses + reorders so the
           shuffle button sits to the RIGHT of the swatch group): */
        .sect:has(> .swatches) {
          display: grid;
          grid-template-columns: 1fr auto;
          column-gap: 10px;
          row-gap: 8px;
          align-items: center;
        }
        .sect:has(> .swatches) > .head { display: contents; }
        .sect:has(> .swatches) > .head > h2 { display: none; }
        .sect:has(> .swatches) > .swatches { grid-column: 1; grid-row: 1; }
        .sect:has(> .swatches) > .head > #shuffle { grid-column: 2; grid-row: 1; }
        .sect:has(> .swatches) > #seedWrap { grid-column: 1 / -1; grid-row: 2; }

        /* Swatches: ONE rounded frame, divided into 4 connected
           segments. No HEX, no role text — just colour. */
        .swatches {
          display: flex;
          flex-direction: row;
          gap: 0;
          padding: 0;
          background: var(--card);
          border: 1px solid var(--line);
          border-radius: 12px;
          overflow: hidden;
        }
        .swatch {
          position: relative;
          flex: 1;
          padding: 0;
          height: 44px;
          border: none;
          border-bottom: none;
          border-right: 1px solid var(--line);
        }
        .swatch:last-child { border-right: none; }
        .swatch .chip2 {
          position: absolute; inset: 0;
          width: 100%; height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
        .swatch .chip2 input { inset: 0; width: 100%; height: 100%; }
        .swatch .role, .swatch .hex { display: none; }

        /* Format + size: two selects side by side, no labels above. */
        .two { gap: 8px; }

        /* Meta below preview + hint below Download fold into the tiny
           "i" tap-tooltip — neither takes layout space here. The
           #status line stays so encoding progress is still visible,
           but starts empty (the "Ready" init text is dropped in JS). */
        .meta { display: none; }
        .hint { display: none; }
        #status { font-size: 12px; text-align: center; min-height: 0; }
      }
    </style>
    <script type="module" crossorigin src="/fun/assets/export-ClsDwJlG.js"></script>
    <link rel="modulepreload" crossorigin href="/fun/assets/render-CCgHOVR5.js">
    <link rel="modulepreload" crossorigin href="/fun/assets/palette-D5fFc6np.js">
  </head>
  <body>
    <!-- Fixed top-left breadcrumb: portfolio → FunType. The Export title
         below makes the third step implicit, so this collapses cleanly. -->
    <nav class="ft-back" aria-label="Breadcrumb">
      <a class="ft-back-link" href="/">
        <span class="ft-back-slash" aria-hidden="true">/</span>
        <span class="ft-back-label">portfolio</span>
      </a>
      <span class="ft-back-sep" aria-hidden="true">/</span>
      <a class="ft-back-link" href="./">
        <span class="ft-back-label">FunType</span>
      </a>
    </nav>

    <div class="topbar lead"></div>

    <!-- Mobile close button — replaces the breadcrumb on phones with a
         single X at top-right that just steps back through history. -->
    <button class="ft-close" id="ftClose" type="button" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>

    <div class="lead title-row">
      <h1>Export</h1>
    </div>

    <div class="grid">
      <div class="stage">
        <div class="frame"><canvas id="preview" width="540" height="540"></canvas></div>
        <p class="meta" id="meta">12 fps · seamless loop</p>
      </div>

      <div class="panel">
        <div class="sect">
          <div class="head"><h2>Text</h2></div>
          <input id="word" type="text" value="Corner" maxlength="60" placeholder="Type a word…" />
        </div>

        <div class="sect">
          <div class="head">
            <h2>Colour</h2>
            <button class="iconbtn round" id="shuffle" title="Shuffle palette" aria-label="Shuffle palette">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
            </button>
          </div>
          <div class="swatches" id="swatches"></div>
          <div id="seedWrap" style="display:none;">
            <button class="iconbtn" id="seedShuffle" title="Shuffle corner positions">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M21 3l-7.5 7.5"/><path d="M3 21l7.5-7.5"/><path d="M16 21h5v-5"/></svg>
              Shuffle corners
            </button>
          </div>
        </div>

        <div class="sect">
          <div class="head"><h2>Output</h2></div>
          <label class="fld">Orientation</label>
          <div class="seg" id="orient">
            <button data-o="square" aria-pressed="true"><span class="ic"><i style="width:14px;height:14px"></i></span>Square</button>
            <button data-o="portrait" aria-pressed="false"><span class="ic"><i style="width:9px;height:15px"></i></span>Portrait</button>
            <button data-o="landscape" aria-pressed="false"><span class="ic"><i style="width:18px;height:10px"></i></span>Landscape</button>
          </div>
          <div class="two">
            <div>
              <label class="fld" for="format">Format</label>
              <select id="format">
                <option value="webm" selected>WebM</option>
                <option value="mp4">MP4</option>
                <option value="gif">GIF</option>
                <option value="gif-small">GIF · small (≤8MB)</option>
                <option value="png">PNG sequence</option>
                <option value="svg">SVG (static)</option>
                <option value="embed">Embed (iframe)</option>
              </select>
            </div>
            <div>
              <label class="fld" for="size">Resolution</label>
              <select id="size">
                <option value="720">720 · social</option>
                <option value="1080" selected>1080 · HD</option>
                <option value="1440">1440 · large screens</option>
                <option value="2160">2160 · 4K</option>
              </select>
            </div>
          </div>
        </div>

        <div class="sect">
          <div class="download-row">
            <button class="download" id="download">Download</button>
            <span class="info-ic" id="exportInfo" data-tip=""></span>
          </div>
          <p id="status"></p>
          <p class="hint" id="formatHint"></p>
        </div>
      </div>
    </div>

  </body>
</html>
